<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>6. STEM 7 · Урок 6 · Я, моє тіло, здорове харчування. Хімія людського організму</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/js/all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#f4f2fb; --surface:#ffffff; --surface-2:#f7f6fc; --surface-3:#edeafc;
  --border:#e1ddf5; --ink:#1c1830; --ink-dim:#5c5578; --ink-faint:#948dae;
  --accent:#7c3aed; --accent-ink:#ffffff; --accent-soft:#efe8fd;
  --shadow:0 2px 10px rgba(40,20,90,.08); --shadow-lg:0 18px 44px rgba(40,20,90,.16);
  --s:#16a34a; --s-soft:#e6f7ec; --t:#2563eb; --t-soft:#e7effe;
  --e:#ca8a04; --e-soft:#fbf1dc; --m:#dc2626; --m-soft:#fbe6e5;
  --font-display:'Unbounded',sans-serif; --font-body:'IBM Plex Sans',sans-serif; --font-mono:'IBM Plex Mono',monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141126; --surface:#1c1832; --surface-2:#221d3c; --surface-3:#2b2549;
    --border:#352e57; --ink:#f1eefb; --ink-dim:#bcb4dc; --ink-faint:#847bab;
    --accent:#a78bfa; --accent-ink:#1c1832; --accent-soft:#312a54;
    --shadow:0 2px 10px rgba(0,0,0,.35); --shadow-lg:0 18px 44px rgba(0,0,0,.5);
    --s:#4ade80; --s-soft:#173726; --t:#60a5fa; --t-soft:#182c4c;
    --e:#facc15; --e-soft:#3a3011; --m:#f87171; --m-soft:#3d1c1e;
  }
}
:root[data-theme="dark"]{
  --bg:#141126; --surface:#1c1832; --surface-2:#221d3c; --surface-3:#2b2549;
  --border:#352e57; --ink:#f1eefb; --ink-dim:#bcb4dc; --ink-faint:#847bab;
  --accent:#a78bfa; --accent-ink:#1c1832; --accent-soft:#312a54;
  --shadow:0 2px 10px rgba(0,0,0,.35); --shadow-lg:0 18px 44px rgba(0,0,0,.5);
  --s:#4ade80; --s-soft:#173726; --t:#60a5fa; --t-soft:#182c4c;
  --e:#facc15; --e-soft:#3a3011; --m:#f87171; --m-soft:#3d1c1e;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);}
body{font-family:var(--font-body);color:var(--ink);overflow:hidden;}
.app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}

/* TOPBAR */
.topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex:0 0 auto;z-index:40;}
.brandmark{font-family:var(--font-display);font-weight:800;font-size:1.25rem;letter-spacing:.02em;display:flex;gap:1px;}
.brandmark span.S{color:var(--s);}.brandmark span.T{color:var(--t);}.brandmark span.E{color:var(--e);}.brandmark span.M{color:var(--m);}
.lesson-tag{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-faint);border-left:1px solid var(--border);padding-left:12px;display:none;}
@media(min-width:640px){.lesson-tag{display:block;}}
.progress-wrap{flex:1;height:6px;background:var(--surface-3);border-radius:4px;overflow:hidden;}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--m));border-radius:4px;transition:width .4s ease;}
.icon-btn{background:var(--surface-2);border:1px solid var(--border);color:var(--ink);width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;font-size:.95rem;transition:background .15s, transform .15s;}
.icon-btn:hover{background:var(--surface-3);transform:translateY(-1px);}
.icon-btn:active{transform:translateY(0);}

/* SLIDES */
.viewport{flex:1;position:relative;overflow:hidden;}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .5s ease, transform .5s ease;display:flex;flex-direction:column;justify-content:flex-start;overflow-y:auto;padding:28px 20px 40px;}
.slide.active{opacity:1;pointer-events:auto;}
.slide-inner{max-width:1180px;width:100%;margin-left:auto;margin-right:auto;margin-top:auto;margin-bottom:auto;}
.eyebrow{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}
h1.slide-title{font-family:var(--font-display);font-weight:700;font-size:clamp(1.5rem,3.4vw,2.5rem);line-height:1.15;margin:0 0 14px;}
h2.section-title{font-family:var(--font-display);font-weight:600;font-size:clamp(1.15rem,2.2vw,1.5rem);margin:0 0 12px;}
p.lead{font-size:1.05rem;color:var(--ink-dim);line-height:1.6;max-width:820px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);}
.grid{display:grid;gap:16px;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-5{grid-template-columns:repeat(5,1fr);}
@media(max-width:900px){.grid.cols-3,.grid.cols-4,.grid.cols-5{grid-template-columns:repeat(2,1fr);}}
@media(max-width:700px){.grid.cols-2,.grid.cols-3,.grid.cols-4,.grid.cols-5{grid-template-columns:1fr;}}

.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:.72rem;font-weight:600;padding:4px 10px;border-radius:999px;}
.badge.S{background:var(--s-soft);color:var(--s);}
.badge.T{background:var(--t-soft);color:var(--t);}
.badge.E{background:var(--e-soft);color:var(--e);}
.badge.M{background:var(--m-soft);color:var(--m);}
.badge.accent{background:var(--accent-soft);color:var(--accent);}

.online-note{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:.88rem;color:var(--ink);}
.online-note i{color:var(--accent);margin-top:2px;}
.online-note b{font-family:var(--font-mono);text-transform:uppercase;font-size:.68rem;letter-spacing:.06em;display:block;margin-bottom:3px;color:var(--accent);}

.fact-note{display:flex;gap:10px;align-items:flex-start;background:var(--s-soft);border:1px solid var(--border);border-left:4px solid var(--s);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:.86rem;color:var(--ink);}
.fact-note i{color:var(--s);margin-top:2px;}
.fact-note b{font-family:var(--font-mono);text-transform:uppercase;font-size:.66rem;letter-spacing:.06em;display:block;margin-bottom:3px;color:var(--s);}
.fact-note a{color:var(--s);font-weight:600;}

.safety-note{display:flex;gap:10px;align-items:flex-start;background:var(--m-soft);border:1px solid var(--border);border-left:4px solid var(--m);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:.86rem;color:var(--ink);}
.safety-note i{color:var(--m);margin-top:2px;}
.safety-note b{font-family:var(--font-mono);text-transform:uppercase;font-size:.66rem;letter-spacing:.06em;display:block;margin-bottom:3px;color:var(--m);}

button{font-family:var(--font-body);}
.btn{border:1px solid var(--border);background:var(--surface-2);color:var(--ink);padding:10px 18px;border-radius:12px;font-weight:600;font-size:.92rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .15s;}
.btn:hover{background:var(--surface-3);transform:translateY(-1px);}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.btn.primary:hover{filter:brightness(1.07);}
.btn.small{padding:6px 12px;font-size:.8rem;border-radius:9px;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.btn.ghost{background:transparent;}

textarea,input[type=text],input[type=number],select{
  width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--ink);
  padding:10px 12px;font-family:var(--font-body);font-size:.92rem;resize:vertical;
}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}
label.field-label{display:block;font-size:.78rem;font-weight:600;color:var(--ink-dim);margin:0 0 6px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.04em;}
.hint{font-size:.78rem;color:var(--ink-faint);margin-top:4px;font-style:italic;}
.shake{animation:shake .4s;}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
.field-error{border-color:var(--m) !important;}

/* BOTTOMBAR */
.bottombar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 18px;background:var(--surface);border-top:1px solid var(--border);flex:0 0 auto;z-index:40;}
.nav-btn{background:var(--accent);color:var(--accent-ink);border:none;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;transition:transform .15s, filter .15s;}
.nav-btn:hover{filter:brightness(1.08);transform:translateY(-1px);}
.nav-btn:disabled{opacity:.35;cursor:not-allowed;}
.slide-counter{font-family:var(--font-mono);font-size:.82rem;color:var(--ink-dim);}
.kbd-hint{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-faint);display:none;}
@media(min-width:760px){.kbd-hint{display:block;}}

/* MENU OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(10,6,30,.55);backdrop-filter:blur(2px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;}
.overlay.open{display:flex;}
.overlay-panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;max-width:640px;width:100%;max-height:82vh;overflow-y:auto;padding:20px;box-shadow:var(--shadow-lg);}
.overlay-panel h3{font-family:var(--font-display);margin:0 0 14px;font-size:1.1rem;display:flex;justify-content:space-between;align-items:center;}
.menu-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:.9rem;}
.menu-item:hover{background:var(--surface-2);}
.menu-item .num{font-family:var(--font-mono);color:var(--ink-faint);width:22px;flex:0 0 auto;}
.menu-item.current{background:var(--accent-soft);color:var(--accent);font-weight:600;}

/* timer */
.timer-box{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:10px 16px;}
.timer-display{font-family:var(--font-mono);font-size:1.5rem;font-weight:600;min-width:70px;}
.timer-display.warn{color:var(--e);}
.timer-display.danger{color:var(--m);}

.table-wrap{overflow-x:auto;}
table.roles-table{width:100%;border-collapse:collapse;font-size:.88rem;}
table.roles-table th,table.roles-table td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);}
table.roles-table th{font-family:var(--font-mono);text-transform:uppercase;font-size:.7rem;color:var(--ink-faint);letter-spacing:.05em;}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:.85rem;opacity:0;transition:all .3s;z-index:300;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== flagship lab tool ===== */
.lab-wrap{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start;margin-top:10px;}
.dropper-dock{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface-2);border:2px dashed var(--border);border-radius:16px;padding:16px 18px;}
.dropper-dock.dragging-src{border-color:var(--accent);}
.dropper-icon{width:74px;height:auto;cursor:grab;touch-action:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18));user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none;}
.dropper-icon:active{cursor:grabbing;}
.dropper-label{font-family:var(--font-mono);font-size:.7rem;color:var(--ink-faint);text-align:center;max-width:110px;}
.samples-grid{flex:1;min-width:280px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;}
@media(max-width:640px){.samples-grid{grid-template-columns:repeat(2,1fr);}}
.sample-card{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:10px;text-align:center;transition:border-color .2s, box-shadow .2s;position:relative;}
.sample-card.dragover{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
.sample-card.tested{border-color:var(--s);}
.sample-photo{position:relative;width:100%;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--surface-2);}
.sample-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.stain-layer{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease;mix-blend-mode:multiply;pointer-events:none;}
.stain-layer.show{opacity:1;}
.drop-anim{position:absolute;width:14px;height:14px;border-radius:50% 50% 50% 0;background:#8a5a1a;transform:translate(-50%,-120%) rotate(45deg);opacity:0;pointer-events:none;}
.drop-anim.fall{animation:dropfall .5s ease-in forwards;}
@keyframes dropfall{0%{opacity:1;transform:translate(-50%,-160%) rotate(45deg);}80%{opacity:1;}100%{opacity:0;transform:translate(-50%,-10%) rotate(45deg);}}
.sample-name{font-weight:700;font-size:.86rem;margin-top:8px;}
.sample-status{font-family:var(--font-mono);font-size:.68rem;color:var(--ink-faint);margin-top:2px;min-height:14px;}
.sample-status.pos{color:var(--t);font-weight:700;}
.sample-status.neg{color:var(--e);font-weight:700;}
.verdict-row{display:flex;gap:6px;justify-content:center;margin-top:8px;}
.verdict-btn{flex:1;font-size:.72rem;padding:6px 4px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;font-weight:600;}
.verdict-btn.selected.yes{background:var(--t-soft);border-color:var(--t);color:var(--t);}
.verdict-btn.selected.no{background:var(--e-soft);border-color:var(--e);color:var(--e);}
.verdict-btn:disabled{opacity:.4;cursor:not-allowed;}
.verdict-correct{outline:2px solid var(--s);}
.verdict-wrong{outline:2px solid var(--m);}

table.protocol-table{width:100%;border-collapse:collapse;font-size:.86rem;}
table.protocol-table th,table.protocol-table td{border:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:middle;}
table.protocol-table th{background:var(--surface-2);font-family:var(--font-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);}
table.protocol-table td.color-cell{font-weight:600;}
table.protocol-table td.color-cell.pos{color:var(--t);}
table.protocol-table td.color-cell.neg{color:var(--e);}
.mini-swatch{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:middle;}

.food-analyze-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.food-analyze-row input{flex:1;}
.guess-chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:.72rem;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--border);cursor:pointer;background:var(--surface-2);}
.guess-chip.active.yes{background:var(--t-soft);color:var(--t);border-color:var(--t);}
.guess-chip.active.no{background:var(--e-soft);color:var(--e);border-color:var(--e);}

/* poll / tally */
.poll-block{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:16px;}
.poll-options{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
.poll-opt-btn{flex:1;min-width:150px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;text-align:center;font-weight:600;transition:all .15s;}
.poll-opt-btn:hover{border-color:var(--accent);}
.poll-count{font-family:var(--font-mono);font-size:1.3rem;display:block;margin-top:4px;}
.poll-fallback-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.poll-fallback-bar-wrap{flex:1;background:var(--surface-2);border-radius:8px;overflow:hidden;height:20px;}
.poll-fallback-bar{height:100%;background:var(--accent);}

/* homework recipe form */
.ingredient-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center;}
@media(max-width:640px){.ingredient-row{grid-template-columns:1fr 1fr;}}
.remove-ing{background:var(--m-soft);color:var(--m);border:none;width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:1rem;}

.hidden-pdf-block{position:fixed;left:-10000px;top:0;width:780px;background:#ffffff !important;padding:32px;font-family:'IBM Plex Sans',sans-serif !important;}
.hidden-pdf-block *{color:#14162a !important;}
.hidden-pdf-block h2{font-family:'Unbounded',sans-serif !important;color:#7c3aed !important;}

@media(max-width:640px){.slide{padding:18px 12px 34px;}.card{padding:16px;}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brandmark"><span class="S">S</span><span class="T">T</span><span class="E">E</span><span class="M">M</span></div>
    <div class="lesson-tag">7 клас · Урок 6 · Хімія людського організму</div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <button class="icon-btn" id="themeBtn" title="Тема оформлення"><i class="fa-solid fa-circle-half-stroke"></i></button>
    <button class="icon-btn" id="menuBtn" title="Усі слайди"><i class="fa-solid fa-bars"></i></button>
  </div>

  <div class="viewport" id="viewport"></div>

  <div class="bottombar">
    <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="slide-counter"><span id="curNum">1</span> / <span id="totalNum">12</span></div>
    <span class="kbd-hint">← → навігація · Esc меню</span>
    <button class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
  </div>
</div>

<div class="overlay" id="menuOverlay">
  <div class="overlay-panel">
    <h3>Усі слайди <button class="icon-btn" id="closeMenuBtn"><i class="fa-solid fa-xmark"></i></button></h3>
    <div id="menuList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="pdfHiddenRoot"></div>

<script>

const LP = "stem7l6-";
function lsGet(key, fallback){
  try{ const v = localStorage.getItem(LP+key); return v===null? fallback : JSON.parse(v); }catch(e){ return fallback; }
}
function lsSet(key, val){
  try{ localStorage.setItem(LP+key, JSON.stringify(val)); }catch(e){}
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2400);
}
function requireField(el){
  if(!el.value || !el.value.trim()){
    el.classList.add('field-error','shake');
    setTimeout(()=>el.classList.remove('shake'), 400);
    return false;
  }
  el.classList.remove('field-error');
  return true;
}

function renderAllSlides(){

function goTo(i){
  if(i<0) i=0; if(i>=slides.length) i=slides.length-1;
  // safety net: remove any stuck drag-ghost element left over from an interrupted touch drag
  document.querySelectorAll('.__dropper-ghost').forEach(g=>g.remove());
  current = i;
  lsSet('currentSlide', current);
  slides.forEach((s,idx)=>{
    document.getElementById('slide-'+s.id).classList.toggle('active', idx===current);
  });
  document.getElementById('curNum').textContent = current+1;
  document.getElementById('progressBar').style.width = (((current+1)/slides.length)*100)+'%';
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===slides.length-1;
  refreshOnEnter(slides[current].id);
  buildMenu();
  window.scrollTo(0,0);
}

function refreshOnEnter(slideId){
  if(slideId==='experiment'){ const el=document.getElementById('slide-experiment'); el.innerHTML=renderExperiment(); attachExperiment(); }
  if(slideId==='protocol'){ const el=document.getElementById('slide-protocol'); el.innerHTML=renderProtocol(); attachProtocol(); }
  if(slideId==='analysis'){ const el=document.getElementById('slide-analysis'); el.innerHTML=renderAnalysis(); attachAnalysis(); }
  if(slideId==='reflection'){ const el=document.getElementById('slide-reflection'); el.innerHTML=renderReflection(); attachReflection(); }
}

document.getElementById('totalNum').textContent = slides.length;
document.getElementById('prevBtn').addEventListener('click', ()=>goTo(current-1));
document.getElementById('nextBtn').addEventListener('click', ()=>goTo(current+1));

document.addEventListener('keydown', (e)=>{
  const tag = (e.target && e.target.tagName) || '';
  if(tag==='INPUT' || tag==='TEXTAREA') return;
  if(e.key==='ArrowRight') goTo(current+1);
  else if(e.key==='ArrowLeft') goTo(current-1);
  else if(e.key==='Home') goTo(0);
  else if(e.key==='End') goTo(slides.length-1);
  else if(e.key==='Escape'){ closeMenu(); }
});

  else document.documentElement.removeAttribute('data-theme');
}

/* ============ TIMER FACTORY ============ */
function makeTimer(container, seconds, label){
  let remaining = seconds; let intervalId = null; let running=false;
  container.innerHTML = `
    <div class="timer-box">
      <i class="fa-regular fa-clock" style="color:var(--accent)"></i>
      <div><div class="timer-display" data-disp>${fmt(remaining)}</div><div style="font-size:.7rem;color:var(--ink-faint);font-family:var(--font-mono)">${label||''}</div></div>
      <button class="btn small" data-act="startpause" type="button">Старт</button>
      <button class="btn small ghost" data-act="reset" type="button">Скинути</button>
    </div>`;
  const disp = container.querySelector('[data-disp]');
  const spBtn = container.querySelector('[data-act="startpause"]');
  const rsBtn = container.querySelector('[data-act="reset"]');
  function fmt(s){ const m=Math.floor(s/60); const ss=s%60; return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }
  function tick(){
    remaining--;
    disp.textContent = fmt(Math.max(remaining,0));
    disp.classList.toggle('warn', remaining<=60 && remaining>20);
    disp.classList.toggle('danger', remaining<=20);
    if(remaining<=0){ clearInterval(intervalId); running=false; spBtn.textContent='Старт'; toast('Час вийшов ⏰'); }
  }
  spBtn.addEventListener('click', ()=>{
    if(running){ clearInterval(intervalId); running=false; spBtn.textContent='Старт'; }
    else{ if(remaining<=0) remaining=seconds; intervalId=setInterval(tick,1000); running=true; spBtn.textContent='Пауза'; }
  });
  rsBtn.addEventListener('click', ()=>{
    clearInterval(intervalId); running=false; remaining=seconds; disp.textContent=fmt(remaining); disp.classList.remove('warn','danger'); spBtn.textContent='Старт';
  });
}

function renderSampleCard(s, res){
  res = res || {tested:false, verdict:null};
  const stainColor = s.starch ? 'radial-gradient(circle at 50% 45%, #0b1c3e 0%, #12234a 40%, rgba(18,35,74,0) 72%)'
                               : 'radial-gradient(circle at 50% 45%, #8a5a1a 0%, #9c6a22 30%, rgba(156,106,34,0) 68%)';
  const statusText = !res.tested ? 'ще не тестовано'
    : (s.starch ? 'яскраво синьо-чорний!' : 'колір майже не змінився');
  const statusClass = !res.tested ? '' : (s.starch ? 'pos' : 'neg');
  return `<div class="sample-card ${res.tested?'tested':''}" id="card-${s.id}" data-id="${s.id}" data-starch="${s.starch}">
    <div class="sample-photo" id="photo-${s.id}">
      <img src="${s.img}" alt="${s.name}">
      <div class="stain-layer ${res.tested?'show':''}" id="stain-${s.id}" style="background:${stainColor};"></div>
    </div>
    <div class="sample-name">${s.name}</div>
    <div class="sample-status ${statusClass}" id="status-${s.id}">${statusText}</div>
    <div class="verdict-row">
      <button type="button" class="verdict-btn ${res.verdict==='yes'?'selected yes':''}" data-verdict="yes" data-id="${s.id}" ${!res.tested?'disabled':''}>Є крохмаль</button>
      <button type="button" class="verdict-btn ${res.verdict==='no'?'selected no':''}" data-verdict="no" data-id="${s.id}" ${!res.tested?'disabled':''}>Немає</button>
    </div>
  </div>`;
}

function reactSample(id){
  const sample = ALL_SAMPLES.find(x=>x.id===id);
  const res = getExpResults()[id];
  if(res && res.tested) return;
  const card = document.getElementById('card-'+id);
  const photo = document.getElementById('photo-'+id);
  if(!photo) return;
  // falling drop animation
  const drop = document.createElement('div');
  drop.className = 'drop-anim';
  drop.style.left = '50%';
  drop.style.top = '0%';
  photo.appendChild(drop);
  requestAnimationFrame(()=>drop.classList.add('fall'));
  setTimeout(()=>{
    const stain = document.getElementById('stain-'+id);
    if(stain) stain.classList.add('show');
    card.classList.add('tested');
    setExpResult(id, {tested:true});
    const statusEl = document.getElementById('status-'+id);
    statusEl.textContent = sample.starch ? 'яскраво синьо-чорний!' : 'колір майже не змінився';
    statusEl.className = 'sample-status ' + (sample.starch?'pos':'neg');
    card.querySelectorAll('.verdict-btn').forEach(b=>b.disabled=false);
    drop.remove();
    updateTestedCount();
    toast(sample.name + ': крапля нанесена, спостерігайте колір');
  }, 550);
}

function updateTestedCount(){
  const results = getExpResults();
  const el = document.getElementById('testedCount');
  if(el) el.textContent = SAMPLES.filter(s=>results[s.id] && results[s.id].tested).length;
  const elExtra = document.getElementById('extraTestedCount');
  if(elExtra) elExtra.textContent = EXTRA_SAMPLES.filter(s=>results[s.id] && results[s.id].tested).length;
}

function attachExperiment(){
  const dock = document.getElementById('dropperDock');
  const dropperSvg = document.getElementById('dropperSvg');
  if(!dock || !dropperSvg) return;

  const timerBox = document.getElementById('expTimerBox');
  if(timerBox) makeTimer(timerBox, 12*60, 'Час на дослід (5.5 сценарію)');

  // Desktop drag & drop (native HTML5 DnD)
  dropperSvg.addEventListener('dragstart', (e)=>{
    e.dataTransfer.setData('text/plain','iodine');
    dock.classList.add('dragging-src');
  });
  dropperSvg.addEventListener('dragend', ()=> dock.classList.remove('dragging-src'));

  document.querySelectorAll('.sample-card').forEach(card=>{
    card.addEventListener('dragover', (e)=>{ e.preventDefault(); card.classList.add('dragover'); });
    card.addEventListener('dragleave', ()=> card.classList.remove('dragover'));
    card.addEventListener('drop', (e)=>{
      e.preventDefault();
      card.classList.remove('dragover');
      reactSample(card.dataset.id);
    });
    // simple click/tap fallback for touch devices without full DnD
    card.addEventListener('click', ()=>{
      if(window.__lastPointerWasDropperDrag) return;
    });
  });

  // Touch / pointer based drag fallback (works on mobile, incl. iOS Safari)
  let dragGhost = null, dragging = false, activePointerId = null;
  let lastPointerY = null, autoScrollRAF = null;

  const AUTOSCROLL_EDGE = 90;   // px from top/bottom of the viewport that triggers scrolling
  const AUTOSCROLL_MAX_SPEED = 16; // px per animation frame at the very edge

  function getScrollableSlide(){
    return document.querySelector('.slide.active');
  }

  function autoScrollTick(){
    if(!dragging || lastPointerY===null){ autoScrollRAF = null; return; }
    const slideEl = getScrollableSlide();
    if(slideEl){
      const vh = window.innerHeight;
      if(lastPointerY < AUTOSCROLL_EDGE){
        const speed = AUTOSCROLL_MAX_SPEED * (1 - lastPointerY/AUTOSCROLL_EDGE);
        slideEl.scrollTop -= speed;
      } else if(lastPointerY > vh - AUTOSCROLL_EDGE){
        const speed = AUTOSCROLL_MAX_SPEED * (1 - (vh-lastPointerY)/AUTOSCROLL_EDGE);
        slideEl.scrollTop += speed;
      }
    }
    autoScrollRAF = requestAnimationFrame(autoScrollTick);
  }

  function cleanupDrag(){
    dragging = false;
    activePointerId = null;
    lastPointerY = null;
    if(autoScrollRAF){ cancelAnimationFrame(autoScrollRAF); autoScrollRAF = null; }
    if(dragGhost){ dragGhost.remove(); dragGhost = null; }
    document.querySelectorAll('.sample-card').forEach(c=>c.classList.remove('dragover'));
    dock.classList.remove('dragging-src');
  }

  function pointOverCard(x, y){
    let found = null;
    document.querySelectorAll('.sample-card').forEach(c=>{
      const r = c.getBoundingClientRect();
      if(x>=r.left && x<=r.right && y>=r.top && y<=r.bottom) found = c;
    });
    return found;
  }

  dropperSvg.addEventListener('pointerdown', (e)=>{
    if(e.pointerType==='mouse') return; // mouse uses native DnD above
    e.preventDefault();
    dragging = true;
    activePointerId = e.pointerId;
    lastPointerY = e.clientY;
    dock.classList.add('dragging-src');
    try{ dropperSvg.setPointerCapture(e.pointerId); }catch(err){ /* ignore capture failures on some iOS versions */ }
    dragGhost = dropperSvg.cloneNode(true);
    dragGhost.removeAttribute('id');
    dragGhost.classList.add('__dropper-ghost');
    dragGhost.style.position='fixed';
    dragGhost.style.width='60px';
    dragGhost.style.zIndex='999';
    dragGhost.style.pointerEvents='none';
    dragGhost.style.left=(e.clientX-30)+'px';
    dragGhost.style.top=(e.clientY-30)+'px';
    document.body.appendChild(dragGhost);
    if(!autoScrollRAF) autoScrollRAF = requestAnimationFrame(autoScrollTick);
  });
  dropperSvg.addEventListener('pointermove', (e)=>{
    if(!dragging || e.pointerId!==activePointerId) return;
    e.preventDefault();
    lastPointerY = e.clientY;
    if(dragGhost){
      dragGhost.style.left=(e.clientX-30)+'px';
      dragGhost.style.top=(e.clientY-30)+'px';
    }
    document.querySelectorAll('.sample-card').forEach(c=>{
      const r = c.getBoundingClientRect();
      const over = e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom;
      c.classList.toggle('dragover', over);
    });
  });
  function finishDrag(e, shouldReact){
    if(!dragging || (activePointerId!==null && e.pointerId!==activePointerId)) return;
    const card = shouldReact ? pointOverCard(e.clientX, e.clientY) : null;
    cleanupDrag();
    if(card) reactSample(card.dataset.id);
  }
  dropperSvg.addEventListener('pointerup', (e)=> finishDrag(e, true));
  // iOS Safari sometimes fires pointercancel instead of pointerup (system gestures,
  // multi-touch, or momentarily losing pointer capture) — without this the ghost
  // icon would freeze on screen. Also guard with lostpointercapture as a second net.
  dropperSvg.addEventListener('pointercancel', (e)=> finishDrag(e, false));
  dropperSvg.addEventListener('lostpointercapture', (e)=>{ if(dragging) finishDrag(e, false); });
  // Absolute safety net: if anything above fails to fire, a pointerup/cancel anywhere
  // on the page still cleans up so the dropper never stays stuck mid-drag.
  window.addEventListener('pointerup', (e)=>{ if(dragging) finishDrag(e, true); }, true);
  window.addEventListener('pointercancel', ()=>{ if(dragging) cleanupDrag(); }, true);

  document.querySelectorAll('.verdict-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      const verdict = btn.dataset.verdict;
      const sample = ALL_SAMPLES.find(x=>x.id===id);
      const card = document.getElementById('card-'+id);
      setExpResult(id, {verdict});
      card.querySelectorAll('.verdict-btn').forEach(b=>{
        b.classList.remove('selected','yes','no','verdict-correct','verdict-wrong');
      });
      btn.classList.add('selected', verdict);
      const correct = (verdict==='yes')===sample.starch;
      btn.classList.add(correct?'verdict-correct':'verdict-wrong');
      toast(correct ? 'Правильно! Висновок збігається зі спостереженням.' : 'Порівняйте колір знову: чи справді він синьо-чорний?');
    });
  });
}

    </div>

}

function attachAnalysis(){

  if(!wrap) return;
  let foods = getAnalysisFoods();
  if(foods.length===0){ foods=[{name:'',guess:null},{name:'',guess:null},{name:'',guess:null}]; setAnalysisFoods(foods); }
  function redraw(){
    wrap.innerHTML = foods.map((f,i)=>renderFoodRow(f,i)).join('');
    bind();
  }
  function bind(){
    wrap.querySelectorAll('.food-name-input').forEach(inp=>{
      inp.addEventListener('input', ()=>{ foods[parseInt(inp.dataset.idx)].name = inp.value; setAnalysisFoods(foods); });
    });
    wrap.querySelectorAll('.guess-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{

        setAnalysisFoods(foods);
        redraw();
      });
    });
    wrap.querySelectorAll('.remove-ing').forEach(b=>{
      b.addEventListener('click', ()=>{
        foods.splice(parseInt(b.dataset.idx),1);
        setAnalysisFoods(foods);
        redraw();
      });
    });
  }
  redraw();
  const addBtn = document.getElementById('addFoodRowBtn');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    foods.push({name:'',guess:null});

  });
}

function renderFallbackBars(containerId, data, labels){
  const el = document.getElementById(containerId);
  if(!el) return;
  const max = Math.max(1, ...data);
  el.innerHTML = labels.map((l,i)=>`
    <div class="poll-fallback-row">
      <div style="width:150px;font-size:.8rem;">${l}</div>
      <div class="poll-fallback-bar-wrap"><div class="poll-fallback-bar" style="width:${(data[i]/max*100)}%"></div></div>
      <div style="font-family:var(--font-mono);font-size:.8rem;width:24px;text-align:right;">${data[i]}</div>
    </div>`).join('');
}

function drawPollChart(canvasId, fallbackContainerId, labels, data, color){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  try{
    if(typeof Chart === 'undefined') throw new Error('no chart lib');
    if(canvas._chartInstance) canvas._chartInstance.destroy();
    canvas._chartInstance = new Chart(canvas.getContext('2d'), {
      type:'bar',
      data:{ labels, datasets:[{ data, backgroundColor: color, borderRadius:8 }] },
      options:{ responsive:true, plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } } }
    });
    canvas.style.display='';
    const fb = document.getElementById(fallbackContainerId);
    if(fb) fb.style.display='none';
  }catch(e){
    canvas.style.display='none';
    document.getElementById(canvasId).insertAdjacentHTML('afterend', `<div id="${fallbackContainerId}"></div>`);
    renderFallbackBars(fallbackContainerId, data, labels);
  }
}

function attachReflection(){
  document.querySelectorAll('.poll-opt-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const q = btn.dataset.poll, opt = btn.dataset.opt;
      const poll = getPollData();
      const mine = getMyPollChoice();
      if(mine[q] === opt) return; // already voted this
      if(mine[q]) poll[q][mine[q]] = Math.max(0, poll[q][mine[q]]-1); // move vote
      poll[q][opt] = (poll[q][opt]||0) + 1;
      mine[q] = opt;
      lsSet('reflectionPoll', poll);
      lsSet('reflectionPollMine', mine);
      document.getElementById('slide-reflection').innerHTML = renderReflection();
      attachReflection();
      toast('Дякую за відповідь! 🖐️');
    });
  });
  const whichInp = document.getElementById('whichSample');
  if(whichInp) whichInp.addEventListener('input', ()=> lsSet('reflectionWhich', whichInp.value));

  const poll = getPollData();
  drawPollChart('pollChart1','fallbackq1', ['Здивував','Не здивував'], [poll.q1.surprised, poll.q1.notSurprised], ['#7c3aed','#2563eb']);
  drawPollChart('pollChart2','fallbackq2', ['Так','Поки ні'], [poll.q2.yes, poll.q2.no], ['#16a34a','#ca8a04']);
}

    <p class="lead">Оберіть одну свою улюблену домашню страву (наприклад, борщ, омлет, гречану кашу з котлетою) і запишіть основні інгредієнти з приблизною кількістю. Якщо не знаєте точних пропорцій — запитайте вдома або запишіть орієнтовно «на око». Це знадобиться для розрахунку калорійності й БЖУ на уроці 7.</p>
    <div class="card" id="recipeForm">
      <div class="grid cols-2">
        <div><label class="field-label">Ім'я</label><input type="text" id="hwName"></div>
        <div><label class="field-label">Клас</label><input type="text" id="hwClass" placeholder="7-А"></div>
      </div>
      <div style="margin-top:12px;"><label class="field-label">Назва страви</label><input type="text" id="hwDish" placeholder="напр. Гречана каша з котлетою"></div>
      <div style="margin-top:14px;">
        <label class="field-label">Інгредієнти</label>
        <div id="ingredientRows"></div>
        <button class="btn small" id="addIngBtn" type="button"><i class="fa-solid fa-plus"></i> Додати інгредієнт</button>
      </div>
      <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn primary" id="saveRecipeBtn" type="button"><i class="fa-solid fa-floppy-disk"></i> Зберегти рецепт</button>
        <button class="btn" id="savePdfBtn" type="button"><i class="fa-solid fa-file-pdf"></i> Зберегти в PDF</button>
        <span id="hwSaveStatus" style="font-size:.8rem;color:var(--ink-faint);align-self:center;"></span>
      </div>
    </div>
    <div class="fact-note"><i class="fa-solid fa-calculator"></i><div><b>Навіщо це</b>На уроці 7 ви вперше розрахуєте точний вміст білків, жирів і вуглеводів (включно з крохмалем) у своїй реальній домашній страві за таблицями калорійності — саме за цими записаними сьогодні пропорціями.</div></div>
  </div>`;
}

function renderIngredientRow(ing, i){
  return `<div class="ingredient-row" data-idx="${i}">
    <input type="text" class="ing-name" placeholder="Інгредієнт (напр. яйце)" value="${(ing.name||'').replace(/"/g,'&quot;')}" data-idx="${i}">
    <input type="text" class="ing-amount" placeholder="Кількість" value="${(ing.amount||'').replace(/"/g,'&quot;')}" data-idx="${i}">
    <input type="text" class="ing-unit" placeholder="Одиниця (г/мл/шт)" value="${(ing.unit||'').replace(/"/g,'&quot;')}" data-idx="${i}">
    <button type="button" class="remove-ing" data-idx="${i}" title="Видалити"><i class="fa-solid fa-xmark"></i></button>
  </div>`;
}

function attachHomework(){
  const rowsWrap = document.getElementById('ingredientRows');
  if(!rowsWrap) return;
  const recipe = getRecipe();
  document.getElementById('hwName').value = recipe.studentName || '';
  document.getElementById('hwClass').value = recipe.studentClass || '';
  document.getElementById('hwDish').value = recipe.dish || '';

  function redrawIng(){
    rowsWrap.innerHTML = recipe.ingredients.map((ing,i)=>renderIngredientRow(ing,i)).join('');
    rowsWrap.querySelectorAll('.ing-name,.ing-amount,.ing-unit').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        const i = parseInt(inp.dataset.idx);
        if(inp.classList.contains('ing-name')) recipe.ingredients[i].name = inp.value;
        if(inp.classList.contains('ing-amount')) recipe.ingredients[i].amount = inp.value;
        if(inp.classList.contains('ing-unit')) recipe.ingredients[i].unit = inp.value;
      });
      inp.addEventListener('keydown', (e)=>{
        if(e.key==='Enter'){
          e.preventDefault();
          recipe.ingredients.push({name:'',amount:'',unit:''});
          redrawIng();
          const rows = rowsWrap.querySelectorAll('.ing-name');
          if(rows.length) rows[rows.length-1].focus();
        }
      });
    });
    rowsWrap.querySelectorAll('.remove-ing').forEach(b=>{
      b.addEventListener('click', ()=>{
        recipe.ingredients.splice(parseInt(b.dataset.idx),1);
        if(recipe.ingredients.length===0) recipe.ingredients.push({name:'',amount:'',unit:''});
        redrawIng();
      });
    });
  }
  redrawIng();

  document.getElementById('addIngBtn').addEventListener('click', ()=>{
    recipe.ingredients.push({name:'',amount:'',unit:''});
    redrawIng();
  });

  document.getElementById('saveRecipeBtn').addEventListener('click', ()=>{
    const dishEl = document.getElementById('hwDish');
    if(!requireField(dishEl)){ toast('Вкажіть назву страви'); return; }
    recipe.dish = dishEl.value;
    recipe.studentName = document.getElementById('hwName').value;
    recipe.studentClass = document.getElementById('hwClass').value;
    setRecipe(recipe);
    document.getElementById('hwSaveStatus').textContent = 'Збережено ✓';
    toast('Рецепт збережено');
  });

  document.getElementById('savePdfBtn').addEventListener('click', async ()=>{
    const dishEl = document.getElementById('hwDish');
    if(!requireField(dishEl)){ toast('Спочатку вкажіть назву страви'); return; }
    const nameEl = document.getElementById('hwName');
    if(!requireField(nameEl)){ toast("Вкажіть ім'я перед збереженням у PDF"); return; }
    recipe.dish = dishEl.value;
    recipe.studentName = nameEl.value;
    recipe.studentClass = document.getElementById('hwClass').value;
    setRecipe(recipe);
    await exportRecipePdf(recipe);
  });
}

async function exportRecipePdf(recipe){
  const root = document.getElementById('pdfHiddenRoot');
  const ingRows = recipe.ingredients.filter(i=>i.name).map(i=>`<tr><td style="padding:6px 10px;border:1px solid #ccc;">${i.name}</td><td style="padding:6px 10px;border:1px solid #ccc;">${i.amount||''}</td><td style="padding:6px 10px;border:1px solid #ccc;">${i.unit||''}</td></tr>`).join('');
  root.innerHTML = `<div class="hidden-pdf-block" id="pdfBlock">
    <h2 style="margin:0 0 4px;">STEM · 7 клас · Урок 6</h2>
    <p style="margin:0 0 16px;font-size:14px;">Домашнє завдання: рецепт страви для розрахунку БЖУ (урок 7)</p>
    <p style="margin:4px 0;"><b>Ім'я:</b> ${recipe.studentName||''} &nbsp;&nbsp; <b>Клас:</b> ${recipe.studentClass||''}</p>
    <p style="margin:4px 0 14px;"><b>Страва:</b> ${recipe.dish||''}</p>
    <table style="border-collapse:collapse;width:100%;font-size:13px;">
      <thead><tr>
        <th style="padding:6px 10px;border:1px solid #ccc;text-align:left;">Інгредієнт</th>
        <th style="padding:6px 10px;border:1px solid #ccc;text-align:left;">Кількість</th>
        <th style="padding:6px 10px;border:1px solid #ccc;text-align:left;">Одиниця</th>
      </tr></thead>
      <tbody>${ingRows || '<tr><td colspan="3" style="padding:6px 10px;border:1px solid #ccc;">—</td></tr>'}</tbody>
    </table>
  </div>`;
  const block = document.getElementById('pdfBlock');
  try{
    const canvas = await html2canvas(block, {
      scale:2, backgroundColor:'#ffffff',
      onclone:(doc)=>{
        doc.querySelectorAll('.hidden-pdf-block, .hidden-pdf-block *').forEach(el=>{ el.style.color = '#14162a'; });
      }
    });
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const imgW = pageW - 20;
    const imgH = canvas.height * imgW / canvas.width;
    let heightLeft = imgH, position = 10;
    pdf.addImage(imgData, 'PNG', 10, position, imgW, imgH);
    heightLeft -= (pageH - 20);
    while(heightLeft > 0){
      pdf.addPage();
      position = heightLeft - imgH + 10;
      pdf.addImage(imgData, 'PNG', 10, position, imgW, imgH);
      heightLeft -= (pageH - 20);
    }
    const filename = `STEM7_Урок6_${(recipe.studentName||'учень').replace(/\s+/g,'_')}_${(recipe.studentClass||'клас').replace(/\s+/g,'_')}.pdf`;
    const blob = pdf.output('blob');

    // Tier 1: platform downloads capability (works inside the Claude artifact viewer)
    let savedViaCapability = false;
    try{
      if(window.claude && typeof window.claude.use === 'function'){
        const downloads = await window.claude.use('downloads');
        if(downloads){
          await downloads.save({ filename, data: blob });
          savedViaCapability = true;
        }
      }
    }catch(capErr){
      savedViaCapability = false; // declined / unavailable / any error -> fall through
    }

    // Tier 2: plain <a download> with a Blob URL (works on GitHub Pages / any static host)
    if(!savedViaCapability){
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(blobUrl), 4000);
    }
    toast('PDF збережено ✓');
  }catch(err){
    // Tier 3: explicit, never-silent failure
    console.error(err);
    toast('Не вдалося зберегти PDF. Спробуйте ще раз або зробіть знімок екрана.');
  }
}
